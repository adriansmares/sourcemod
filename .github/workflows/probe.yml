# Throwaway: how cl.exe -E, gcc -E and clang -E spell the paths in their line markers.
name: probe line marker paths
on:
  push:
    branches: [probe/cl-line-paths]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, cc: cl }
          - { os: windows-2022, cc: clang-cl }
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Create the tree
        run: |
          mkdir -p tree/src tree/include
          printf '#include "foo.h"\n#include <bar.h>\n#include <stdio.h>\nint main(void) { return FOO + BAR; }\n' > tree/src/main.c
          printf '#define FOO 1\n' > tree/src/foo.h
          printf '#include "bar_impl.h"\n' > tree/include/bar.h
          printf '#define BAR 2\n' > tree/include/bar_impl.h
      - name: Preprocess
        run: |
          exec > >(tee "$RUNNER_TEMP/out.txt") 2>&1
          # Every distinct path the line markers name, with the stdio.h chain left out.
          markers() { grep -aE '^#(line)? *[0-9]+ "' | sed -E 's/^#(line)? *[0-9]+ ("[^"]*").*/\2/' | grep -aviE 'stdio|crt|ucrt|vcruntime|sal|concurrencysal|/usr/' | sort -u; }
          if [ "${{ matrix.cc }}" = gcc ] || [ "${{ matrix.cc }}" = clang ]; then
            pp() { ${{ matrix.cc }} -E "$@"; }; I=-I
          else
            pp() { ${{ matrix.cc }} -nologo -E "$@" 2>/dev/null; }; I=-I
          fi
          cd tree
          echo "== relative, from the tree root: src/main.c ${I}include"
          pp src/main.c ${I}include | markers
          echo "== relative, from src: main.c ${I}../include"
          (cd src && pp main.c ${I}../include | markers)
          echo "== absolute"
          if [ "$RUNNER_OS" = Windows ]; then root=$(cygpath -w "$PWD"); else root=$PWD; fi
          pp "$root/src/main.c" "${I}$root/include" | markers
          echo "== the stdio.h chain, first three"
          pp src/main.c ${I}include | grep -aE '^#(line)? *[0-9]+ "' | grep -aiE 'stdio|/usr/|crt' | sed -E 's/^#(line)? *[0-9]+ ("[^"]*").*/\2/' | sort -u | head -3
      - name: Publish the output as an annotation
        if: always()
        run: |
          # Annotations are readable through the public API, job logs are not.
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/out.txt" | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=${{ matrix.cc }}::$msg"
