# Throwaway: which source changes reach sccache's main key, and what a miss looks like.
name: probe line marker paths
on:
  push:
    branches: [probe/cl-line-paths]
  workflow_dispatch:
jobs:
  keys:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, cc: cl }
          - { os: windows-2022, cc: clang-cl }
          - { os: ubuntu-24.04, cc: gcc }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: ./keys.sh ${{ matrix.cc }} 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - &publish
        name: Publish the output as an annotation
        if: always()
        run: |
          # Annotations are readable through the public API, job logs are not.
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/out.txt" | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=${{ github.job }}::$msg"
  e2e:
    strategy:
      fail-fast: false
      matrix:
        sccache: [release, pr]
    runs-on: windows-2022
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - if: matrix.sccache == 'release'
        run: |
          curl -sSfL -o s.zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          unzip -qj s.zip '*/sccache.exe' -d "$RUNNER_TEMP/bin"
      - if: matrix.sccache == 'pr'
        run: |
          git clone -q --depth 1 -b windows-msvc-preprocessor-cache https://github.com/adriansmares/sccache "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src" && cargo build -q && mkdir -p "$RUNNER_TEMP/bin" && cp target/debug/sccache.exe "$RUNNER_TEMP/bin/"
      - run: |
          { echo "sccache: ${{ matrix.sccache }} ($("$RUNNER_TEMP/bin/sccache.exe" --version))"; ./e2e.sh "$RUNNER_TEMP/bin/sccache.exe"; } 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - *publish
